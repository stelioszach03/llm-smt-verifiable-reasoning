[mypy]
python_version = 3.11
ignore_missing_imports = True
strict = False
disallow_any_generics = False
no_implicit_optional = False
warn_return_any = False
warn_unused_configs = False
plugins = pydantic.mypy

# Modules below use dynamic pydantic fields (extra="allow"), union constraint
# types, or generator-variant assignment patterns that mypy does not fully
# understand even with the pydantic plugin. Runtime correctness is enforced
# by the pytest + hypothesis suite (see tests/).
#
# Keep this list in sync with the [[tool.mypy.overrides]] block in
# pyproject.toml — both must agree because `make typecheck` uses mypy.ini
# while editors / pre-commit often read pyproject.toml.

[mypy-cegvr.candidate.repair]
ignore_errors = True

[mypy-cegvr.candidate.verifier]
ignore_errors = True

[mypy-cegvr.cli]
ignore_errors = True

[mypy-cegvr.data.*]
ignore_errors = True

[mypy-cegvr.engine.errors]
ignore_errors = True

[mypy-cegvr.engine.repair]
ignore_errors = True

[mypy-cegvr.eval.aggregate]
ignore_errors = True

[mypy-cegvr.generation.llm_linear]
ignore_errors = True

[mypy-cegvr.generation.llm_sudoku]
ignore_errors = True

[mypy-cegvr.generation.llm_latin5]
ignore_errors = True

[mypy-cegvr.grammar.validate]
ignore_errors = True

[mypy-cegvr.plots.curves]
ignore_errors = True

[mypy-cegvr.report.*]
ignore_errors = True

[mypy-cegvr.robustness.*]
ignore_errors = True

[mypy-cegvr.smt.*]
ignore_errors = True

[mypy-cegvr.tables.*]
ignore_errors = True

[mypy-cegvr.utils.random]
ignore_errors = True
